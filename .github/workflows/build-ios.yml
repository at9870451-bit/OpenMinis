name: Build iOS IPA
on:
  push:
    branches: [feat/ios-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    name: Build iOS IPA (arm64 device)
    needs: [components, node_runtime, original_poki]
    runs-on: macos-26
    timeout-minutes: 115
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go (pin 1.25.5 per deps/rclone-mobile/go.mod)
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false

      - name: Environment info
        run: |
          echo "Architecture: $(uname -m)"
          xcodebuild -version
          brew --version | head -1
          go version || true
          python3 --version
          pip3 --version

      - name: Install build dependencies
        run: |
          brew update >/dev/null 2>&1 || true
          brew install ninja llvm lld libarchive pkg-config meson >/dev/null
          meson --version

      - name: Provider customization config
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: Cache native dependency builds
        uses: actions/cache@v4
        with:
          path: |
            deps/lame-build
            deps/ffmpeg-6.1.2
            deps/frameworks
            deps/ish/build-ios
            deps/libs
            deps/include
            deps/resources
            deps/build/rclone
          key: native-deps-v1-${{ runner.os }}-${{ hashFiles('deps/*.sh') }}

      - name: Build native dependencies
        run: |
          set -e
          # The repo tree was rebuilt from a copy that dropped file modes;
          # restore +x on every vendored build script and helper.
          chmod -R +x deps scripts 2>/dev/null || true
          find deps -name "configure" -o -name "*.sh" -o -name "bootstrap" | xargs chmod +x 2>/dev/null || true
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:$PATH"
          echo "ld.lld: $(which ld.lld || echo missing)"
          echo "=== build_lame.sh ==="
          ./deps/build_lame.sh
          echo "=== build_ffmpeg.sh ==="
          ./deps/build_ffmpeg.sh
          echo "=== build_ish.sh ==="
          ./deps/build_ish.sh
          echo "=== prepare_alpine_rootfs.sh (skipped: downloaded on first launch) ==="
          mkdir -p deps/resources
          # Placeholder only: the real image is fetched on first launch.
          printf "placeholder" > deps/resources/alpine-rootfs.zip
          echo "=== build_rclone_ios.sh ==="
          ./deps/build_rclone_ios.sh

      - name: Download original Poki source framework
        uses: actions/download-artifact@v4
        with:
          name: original-poki-framework
          path: original-poki-build

      - name: Build Minis app
        run: |
          set -o pipefail
          xcodebuild -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          set -e
          APP=$(find build -name "Minis.app" -maxdepth 5 | head -1)
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "ERROR: Minis.app not found in build output"
            exit 1
          fi
          echo "Found: $APP"
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP" Payload/
          python3 scripts/embed-poki-original.py Payload/Minis.app original-poki-build
          zip -r -y Minis.ipa Payload
          echo "IPA size: $(du -h Minis.ipa)"
          cp Minis.ipa ./Minis-Release.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: minis-ios-ipa
          path: Minis-Release.ipa
          if-no-files-found: error
          retention-days: 7
  original_poki:
    name: Compile original Poki source module
    runs-on: macos-15
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          repository: at9870451-bit/OpenMinis
          ref: 3994c488edb49111f750e061d58c0290c6e06cab
      - name: Prepare tools
        run: brew install xcodegen ripgrep
      - name: Cache native sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/poki/native/launcher/target
            build-poki/SourcePackages
          key: poki-original-v1-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('vendor/poki/native/launcher/Cargo.lock', 'vendor/poki/native/ios-app/project-amore.yml') }}
      - name: Test PokiCore
        run: swift test --package-path vendor/poki/native/ios/PokiCore
      - name: Compile original Chat and Connection pages
        run: bash scripts/build-poki-original.sh
      - uses: actions/upload-artifact@v4
        with:
          name: original-poki-framework
          path: |
            build-poki/Build/Products/Release-iphoneos/Poki.framework
            build-poki/Build/Products/Release-iphoneos/WebRTC.framework
          if-no-files-found: error
          retention-days: 7

  original_host:
    name: Original-page host integration checks
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: at9870451-bit/OpenMinis
          ref: 3994c488edb49111f750e061d58c0290c6e06cab
      - run: bash scripts/test-original-poki-host.sh
