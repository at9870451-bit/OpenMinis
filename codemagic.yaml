# Codemagic CI — builds the unsigned Amore (Minis) iOS IPA.
#
# 500 free macOS minutes/month on the free tier, billed 1:1 (GitHub Actions
# bills macOS at 10x, which is what exhausted that quota).
#
# Flow mirrors deps/BUILDING.md:
#   1. native deps  (LAME -> FFmpeg -> iSH arm64 -> Alpine rootfs -> rclone)
#   2. xcodebuild Release, code signing disabled
#   3. Payload/*.app zipped into an .ipa, published as a build artifact

workflows:
  ios-ipa:
    name: Amore iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        # deps/rclone-mobile/go.mod pins go 1.25.5; the runner's brew Go is
        # newer and breaks go-json-experiment, so let GOTOOLCHAIN fetch it.
        GOTOOLCHAIN: go1.25.5
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: feat/ios-build
          include: true
      cancel_previous_builds: false
    scripts:
      - name: Checkout submodules
        script: |
          set -e
          git submodule update --init --recursive

      - name: Install build tools
        script: |
          set -e
          brew update >/dev/null 2>&1 || true
          brew install ninja llvm lld libarchive pkg-config meson go >/dev/null

      - name: Build native dependencies
        script: |
          set -e
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:$PATH"
          echo "ld.lld: $(which ld.lld || echo missing)"
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          # Bundle the real rootfs: the sandbox must work on first launch
          # without a network round-trip.
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh

      - name: Build app
        script: |
          set -e
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig
          xcodebuild -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        script: |
          set -e
          APP=$(find build -name "Minis.app" -maxdepth 5 | head -1)
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "ERROR: Minis.app not found"
            exit 1
          fi
          echo "Found: $APP"
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r -y Amore.ipa Payload
          ls -lh Amore.ipa

    artifacts:
      - Amore.ipa
      - build/Build/Products/Release-iphoneos/*.app

  # ---------------------------------------------------------------
  # Stage 1 of the Flutter + Rust migration: proves the toolchain,
  # the codegen and the Rust core all work in a real macOS build.
  # ---------------------------------------------------------------
  flutter-bridge:
    name: Flutter + Rust bridge
    instance_type: mac_mini_m2
    max_build_duration: 75
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Rust toolchain
        script: |
          set -e
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          cargo install flutter_rust_bridge_codegen --version 2.7.0 --locked

      - name: Rust unit tests
        script: |
          set -e
          source "$HOME/.cargo/env"
          cd flutter_skeleton/rust
          cargo test -- --nocapture

      - name: Generate bridge
        script: |
          source "$HOME/.cargo/env"
          cd flutter_skeleton/app
          flutter create --platforms=ios --org com.openamroe . > create.log 2>&1
          # flutter create drops its own counter widget test, which knows
          # nothing about the bridge and would fail the run.
          rm -f test/widget_test.dart
          # Camera / photos / mic / files all need usage strings or iOS kills
          # the app the first time each is touched.
          PLIST=ios/Runner/Info.plist
          add_perm() { /usr/libexec/PlistBuddy -c "Add :$1 string \"$2\"" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :$1 \"$2\"" "$PLIST"; }
          add_perm NSCameraUsageDescription "Amore uses the camera to attach photos to your messages."
          add_perm NSPhotoLibraryUsageDescription "Amore needs access to your photos to attach them to messages."
          add_perm NSPhotoLibraryAddUsageDescription "Amore saves images you export from a chat."
          add_perm NSMicrophoneUsageDescription "Amore records voice input for chat."
          add_perm NSSpeechRecognitionUsageDescription "Amore transcribes your voice into text."
          add_perm NSFaceIDUsageDescription "Amore can lock the app with Face ID."
          add_perm NSLocalNetworkUsageDescription "Amore reaches local model servers and devices on your network."
          echo "--- Info.plist permissions ---"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | grep -E "NSCamera|NSMicrophone|NSPhotoLibrary|NSFaceID" || true
          flutter pub get > pubget.log 2>&1
          # frb canonicalises dart_output before writing; the directory must exist.
          mkdir -p lib/src/rust
          flutter_rust_bridge_codegen generate > frb.log 2>&1
          # Drift tables need generated code before anything can compile.
          dart run build_runner build --delete-conflicting-outputs > build_runner.log 2>&1
          RC2=$?
          tail -40 build_runner.log || true
          if [ $RC2 -ne 0 ]; then exit $RC2; fi
          RC=$?
          echo "=== codegen exit: $RC ==="
          tail -60 frb.log || true
          exit $RC

      - name: Flutter tests
        script: |
          set -e
          source "$HOME/.cargo/env"
          cd flutter_skeleton/rust
          cargo build --release
          cd ../app
          cp ../rust/target/release/libamore_core.dylib . 2>/dev/null || true
          DYLD_LIBRARY_PATH="$PWD:../rust/target/release" \
            DYLD_FALLBACK_LIBRARY_PATH="$PWD:../rust/target/release" \
            flutter test -r expanded > test.log 2>&1
          RC=$?
          echo "=== flutter test exit: $RC ==="
          tail -60 test.log || true
          exit $RC

      - name: Build iOS runner
        script: |
          set -o pipefail
          cd flutter_skeleton/app
          # CocoaPods (needed by the plugin set) makes `flutter build ios
          # --no-codesign` demand a Development Team. Generate the config +
          # pods, then drive xcodebuild directly with signing disabled — the
          # same approach the Swift app uses.
          flutter build ios --config-only --no-codesign > iosbuild.log 2>&1 || true
          (cd ios && pod install >> ../iosbuild.log 2>&1) || true
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build >> iosbuild.log 2>&1
          RC=$?
          echo "=== xcodebuild exit: $RC ==="
          tail -60 iosbuild.log || true
          exit $RC

      - name: Package IPA
        script: |
          set -e
          cd flutter_skeleton/app
          APP=$(find build/ios/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "ERROR: Runner.app not found"
            exit 1
          fi
          echo "Found: $APP"
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r -y Amore-Flutter.ipa Payload
          ls -lh Amore-Flutter.ipa
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" || true
    artifacts:
      - flutter_skeleton/app/Amore-Flutter.ipa
      - flutter_skeleton/app/build/ios/Build/Products/Release-iphoneos/*.app
      - flutter_skeleton/app/frb.log
      - flutter_skeleton/app/pubget.log
      - flutter_skeleton/app/create.log
      - flutter_skeleton/app/test.log
      - flutter_skeleton/app/build_runner.log
      - flutter_skeleton/app/iosbuild.log
