# Codemagic CI — builds the unsigned Amore (Minis) iOS IPA.
#
# 500 free macOS minutes/month on the free tier, billed 1:1 (GitHub Actions
# bills macOS at 10x, which is what exhausted that quota).
#
# Flow mirrors deps/BUILDING.md:
#   1. native deps  (LAME -> FFmpeg -> iSH arm64 -> Alpine rootfs -> rclone)
#   2. xcodebuild Release, code signing disabled
#   3. Payload/*.app zipped into an .ipa, published as a build artifact

workflows:
  ios-ipa:
    name: Amore iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        # deps/rclone-mobile/go.mod pins go 1.25.5; the runner's brew Go is
        # newer and breaks go-json-experiment, so let GOTOOLCHAIN fetch it.
        GOTOOLCHAIN: go1.25.5
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: feat/ios-build
          include: true
      cancel_previous_builds: false
    scripts:
      - name: Checkout submodules
        script: |
          set -e
          git submodule update --init --recursive

      - name: Install build tools
        script: |
          set -e
          brew update >/dev/null 2>&1 || true
          brew install ninja llvm lld libarchive pkg-config meson go >/dev/null

      - name: Build native dependencies
        script: |
          set -e
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:$PATH"
          echo "ld.lld: $(which ld.lld || echo missing)"
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          # Bundle the real rootfs: the sandbox must work on first launch
          # without a network round-trip.
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh

      - name: Build app
        script: |
          set -e
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig
          xcodebuild -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        script: |
          set -e
          APP=$(find build -name "Minis.app" -maxdepth 5 | head -1)
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "ERROR: Minis.app not found"
            exit 1
          fi
          echo "Found: $APP"
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r -y Amore.ipa Payload
          ls -lh Amore.ipa

    artifacts:
      - Amore.ipa
      - build/Build/Products/Release-iphoneos/*.app

  # ---------------------------------------------------------------
  # Stage 1 of the Flutter + Rust migration: proves the toolchain,
  # the codegen and the Rust core all work in a real macOS build.
  # ---------------------------------------------------------------
  flutter-bridge:
    name: Flutter + Rust bridge
    instance_type: mac_mini_m2
    max_build_duration: 75
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Rust toolchain
        script: |
          set -e
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          cargo install flutter_rust_bridge_codegen --version 2.7.0 --locked

      - name: Rust unit tests
        script: |
          set -e
          source "$HOME/.cargo/env"
          cd flutter_skeleton/rust
          cargo test -- --nocapture

      - name: Generate bridge
        script: |
          set -e
          source "$HOME/.cargo/env"
          cd flutter_skeleton
          flutter_rust_bridge_codegen generate
          echo "--- generated Dart (first 40 lines) ---"
          sed -n '1,40p' app/lib/src/rust/api/simple.dart

      - name: Flutter tests
        script: |
          set -e
          source "$HOME/.cargo/env"
          cd flutter_skeleton/rust
          cargo build --release
          cd ../app
          flutter create --platforms=ios --org com.openamroe .
          flutter pub get
          cp ../rust/target/release/libamore_core.dylib . 2>/dev/null || true
          flutter test -r expanded

      - name: Build iOS runner
        script: |
          set -e
          cd flutter_skeleton/app
          flutter build ios --no-codesign
    artifacts:
      - flutter_skeleton/app/build/ios/iphoneos/*.app
