name: amore
description: Amore — ChatGPT-class AI assistant (Flutter shell over a Rust core).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.7.0
  flutter_riverpod: 2.6.1
  go_router: 14.6.2
  dio: 5.7.0
  drift: 2.20.2
  sqlite3_flutter_libs: 0.5.26
  sqlite3: ^2.4.6
  path_provider: 2.1.5
  path: ^1.9.1
  freezed_annotation: 2.4.4
  json_annotation: 4.9.0
  image_picker: 1.1.2
  file_picker: 8.1.6
  record: 5.2.1
  permission_handler: 11.3.1
  share_plus: 10.1.2
  flutter_secure_storage: 9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.4.13
  freezed: ^2.5.2
  json_serializable: 6.8.0
  drift_dev: ^2.20.3
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
